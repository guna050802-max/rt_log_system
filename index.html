<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RT User Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;

    background: url('assets/bg.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* Header */
.header {
    padding: 30px 10px;
    font-size: 22px;
    font-weight: bold;
}

/* Container */
 .container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

/* Buttons */
 .btn {
    width: 100%;
    margin: 15px 0;
    padding: 22px;

    font-size: 24px;
    font-weight: bold;

    border: none;
    border-radius: 18px;

    color: white;

    background: rgba(0, 60, 150, 0.65);
    backdrop-filter: blur(8px);

    box-shadow: 0 0 20px rgba(0,180,255,0.4);

    cursor: pointer;
    transition: 0.3s;
}
.btn:hover {
    transform: scale(1.05);
}

/* Admin Button */
 .admin {
    background: rgba(120,0,255,0.7);
    color: white;
}

/* Footer */
.footer {
    margin-top: 40px;
    font-size: 12px;
    opacity: 0.8;
}
</style>
</head>

<body>
<div style="text-align:center; margin-top:20px;">
     <img src="assets/logo.png" style="width:180px;">
</div>
<div class="header">
    Department of Respiratory Therapy
</div>

<div class="container">

    <button class="btn" onclick="goToRTLog()">
        📝 RT LOG
    </button>

    <button class="btn" onclick="goToViewDashboard()">
        📊 VIEW DASHBOARD
    </button>

    <button class="btn admin" onclick="adminAccess()">
        🔐 ADMIN
    </button>

</div>

<div class="footer">
    Department of Respiratory Therapy Management System
    Designed & Developed by Gunalan M.M
</div>

<script>

// RT LOG PAGE
function goToRTLog() {
    window.location.href = "rtlog.html";
}

// USER VIEW DASHBOARD
function goToViewDashboard() {
    window.location.href = "view-dashboard.html";
}

// ADMIN LOGIN
function adminAccess() {
    window.location.href = "admin-access.html";
}

</script>
</body>
</html>
